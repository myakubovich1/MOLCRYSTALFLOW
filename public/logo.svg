<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- UF Blue background -->
  <rect width="512" height="512" rx="96" fill="#003087"/>

  <!-- Interlocking UF lettermark -->
  <g fill="#FFFFFF">
    <!-- U letter -->
    <path d="
      M 100 120
      L 100 320
      Q 100 400 180 400
      L 230 400
      Q 270 400 270 360
      L 270 120
      L 220 120
      L 220 350
      Q 220 365 205 365
      L 175 365
      Q 150 365 150 340
      L 150 120
      Z
    "/>
    <!-- F letter -->
    <path d="
      M 240 120
      L 240 400
      L 290 400
      L 290 290
      L 370 290
      L 370 250
      L 290 250
      L 290 165
      L 410 165
      L 410 120
      Z
    "/>
  </g>

  <!-- Orange AI circle overlay in bottom-right -->
  <circle cx="370" cy="375" r="85" fill="#FA4616"/>

  <!-- "AI" as bold vector paths (white) -->
  <g fill="#FFFFFF">
    <!-- A letter - bold -->
    <path d="
      M 322 418
      L 351 322
      L 373 322
      L 402 418
      L 383 418
      L 377 398
      L 347 398
      L 341 418
      Z
      M 351 384
      L 373 384
      L 362 347
      Z
    "/>
    <!-- I letter - bold -->
    <path d="
      M 406 322
      L 424 322
      L 424 418
      L 406 418
      Z
    "/>
  </g>
</svg>
